services:
  postgres:
    image: postgres:17.5-alpine
    cpus: ${POSTGRES_CPUS:-1.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
      POSTGRES_USER: ${POSTGRES_USER:-agentforge_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge-migrator}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-agentforge-app}
      POSTGRES_RELAY_PASSWORD: ${POSTGRES_RELAY_PASSWORD:-agentforge-relay}
      POSTGRES_SCHEDULER_PASSWORD: ${POSTGRES_SCHEDULER_PASSWORD:-agentforge-scheduler}
      POSTGRES_HANDOFF_PASSWORD: ${POSTGRES_HANDOFF_PASSWORD:-agentforge-handoff}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/001-app-role.sh:ro

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.13
    cpus: ${REDPANDA_CPUS:-1.0}
    mem_limit: ${REDPANDA_MEMORY_LIMIT:-1g}
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:${REDPANDA_HOST_PORT:-19092}
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "${REDPANDA_HOST_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  scheduler:
    cpus: ${SCHEDULER_CPUS:-0.5}
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-256m}
    build:
      context: .
      dockerfile: services/platform-api/Scheduler.Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-development}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      AGENTFORGE_ENVIRONMENT: ${AGENTFORGE_ENVIRONMENT:-development}
      AGENTFORGE_DATABASE_URL: postgres://agentforge_scheduler:${POSTGRES_SCHEDULER_PASSWORD:-agentforge-scheduler}@postgres:5432/${POSTGRES_DB:-agentforge}?sslmode=disable
      AGENTFORGE_SCHEDULER_HTTP_ADDR: :8081
      AGENTFORGE_SCHEDULER_OWNER: ${AGENTFORGE_SCHEDULER_OWNER:-scheduler-local}
      AGENTFORGE_SCHEDULER_STRATEGY: ${AGENTFORGE_SCHEDULER_STRATEGY:-least-loaded}
      AGENTFORGE_SCHEDULER_KAFKA_HINTS_ENABLED: ${AGENTFORGE_SCHEDULER_KAFKA_HINTS_ENABLED:-false}
      AGENTFORGE_SCHEDULER_RUNNER_IMAGES: ${AGENTFORGE_SCHEDULER_RUNNER_IMAGES:-{"python-3.12":"docker.io/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"}}
      AGENTFORGE_SCHEDULER_WORKSPACE_SIZE_GIB: ${AGENTFORGE_SCHEDULER_WORKSPACE_SIZE_GIB:-10}
      AGENTFORGE_SCHEDULER_STORAGE_CLASS: ${AGENTFORGE_SCHEDULER_STORAGE_CLASS:-standard}
      AGENTFORGE_SCHEDULER_ARTIFACT_DESTINATION_REF: ${AGENTFORGE_SCHEDULER_ARTIFACT_DESTINATION_REF:-artifact-store}
      AGENTFORGE_SCHEDULER_CONFIGURATION_REFS: ${AGENTFORGE_SCHEDULER_CONFIGURATION_REFS:-}
      AGENTFORGE_SCHEDULER_SECRET_REFS: ${AGENTFORGE_SCHEDULER_SECRET_REFS:-}
      AGENTFORGE_KAFKA_BROKERS: redpanda:9092
    ports:
      - "${SCHEDULER_HOST_PORT:-18081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agentrun-handoff:
    profiles: ["kubernetes"]
    cpus: ${HANDOFF_CPUS:-0.5}
    mem_limit: ${HANDOFF_MEMORY_LIMIT:-256m}
    build:
      context: .
      dockerfile: services/platform-api/Handoff.Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-development}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      AGENTFORGE_ENVIRONMENT: ${AGENTFORGE_ENVIRONMENT:-development}
      AGENTFORGE_DATABASE_URL: postgres://agentforge_handoff:${POSTGRES_HANDOFF_PASSWORD:-agentforge-handoff}@postgres:5432/${POSTGRES_DB:-agentforge}?sslmode=disable
      AGENTFORGE_KAFKA_BROKERS: redpanda:9092
      AGENTFORGE_HANDOFF_HTTP_ADDR: :8082
      AGENTFORGE_HANDOFF_PROCESS_TIMEOUT: ${AGENTFORGE_HANDOFF_PROCESS_TIMEOUT:-30s}
      AGENTFORGE_HANDOFF_KAFKA_GROUP: ${AGENTFORGE_HANDOFF_KAFKA_GROUP:-agentforge-agentrun-handoff-v1}
      AGENTFORGE_HANDOFF_KUBECONFIG: /kubeconfig/config
      AGENTFORGE_HANDOFF_CLUSTER_CONTEXTS: ${AGENTFORGE_HANDOFF_CLUSTER_CONTEXTS:-{"cluster-local":"kind-agentforge"}}
      AGENTFORGE_HANDOFF_QUARANTINE_TENANT_ID: ${AGENTFORGE_HANDOFF_QUARANTINE_TENANT_ID:-019b0000-0000-7000-8000-000000000001}
    volumes:
      - ${AGENTFORGE_HANDOFF_KUBECONFIG:-./.local/kubeconfig/config}:/kubeconfig/config:ro
    ports:
      - "${HANDOFF_HOST_PORT:-18082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  minio:
    profiles: ["runner"]
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    cpus: ${RUNNER_MINIO_CPUS:-0.5}
    mem_limit: ${RUNNER_MINIO_MEMORY_LIMIT:-256m}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${RUNNER_MINIO_ROOT_USER:-agentforge-runner}
      MINIO_ROOT_PASSWORD: ${RUNNER_MINIO_ROOT_PASSWORD:-agentforge-runner-secret}
    ports:
      - "${RUNNER_MINIO_HOST_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redpanda-data:
