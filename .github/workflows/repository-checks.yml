name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - uses: docker/setup-buildx-action@v3
      - name: Verify required tools
        run: make check-tools
      - name: Check formatting
        run: |
          make format
          git diff --exit-code
      - name: Verify repository controls
        run: make verify
      - name: Lint Go modules
        run: make lint
      - name: Test Platform API
        run: make test
      - name: Verify event contracts and compatibility
        run: make verify-event-contracts
      - name: Race-test Platform API
        run: go test -race ./services/platform-api/...
      - name: Vet Platform API
        run: go vet ./services/platform-api/...
      - name: Regenerate Operator contracts
        run: |
          make operator-manifests operator-generate
          git diff --exit-code
      - name: Test Operator with envtest
        run: make test-controller
      - name: Integration-test Operator lifecycle with kind
        run: make test-controller-kind
      - name: Integration-test PostgreSQL persistence
        run: make test-integration
      - name: Integration-test Kafka contracts
        run: make test-events-integration
      - name: Build Platform API image
        run: make build-platform-api
      - name: Build Scheduler image
        run: make build-scheduler
      - name: Build AgentRun handoff image
        run: make build-handoff
      - name: Build Agent Operator image
        run: make build-operator
