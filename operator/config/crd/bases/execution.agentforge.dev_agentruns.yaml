---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: agentruns.execution.agentforge.dev
spec:
  group: execution.agentforge.dev
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    shortNames:
    - arun
    singular: agentrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.attempt
      name: Attempt
      type: integer
    - jsonPath: .status.jobName
      name: Job
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentRun is the Schema for the AgentRun API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentRunSpec defines immutable execution intent plus a mutable
              cancellation request.
            properties:
              artifactDestinationRef:
                description: artifactDestinationRef names approved artifact destination
                  configuration.
                properties:
                  name:
                    description: name is a DNS subdomain name of the referenced object.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              attempt:
                description: attempt is the one-based execution attempt number.
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              attemptId:
                description: UUIDv7 is a lowercase RFC 9562 UUID version 7 identifier.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                type: string
              configurationRefs:
                description: configurationRefs names non-sensitive ConfigMaps projected
                  by the Operator.
                items:
                  description: LocalObjectReference identifies an object in the AgentRun
                    namespace.
                  properties:
                    name:
                      description: name is a DNS subdomain name of the referenced
                        object.
                      maxLength: 253
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              deployOnSuccess:
