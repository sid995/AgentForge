                      - VALIDATION
                      - AUTHENTICATION
                      - AUTHORIZATION
                      - QUOTA
                      - CONFLICT
                      - TRANSIENT_DEPENDENCY
                      - PERMANENT_DEPENDENCY
                      - EXECUTION
                      - POLICY
                      - INTERNAL
                      type: string
                    failureReason:
