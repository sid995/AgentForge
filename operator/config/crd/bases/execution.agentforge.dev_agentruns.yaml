                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation represented
                  by status.
                format: int64
                minimum: 0
                type: integer
              phase:
                description: AgentRunPhase is the observed Kubernetes execution phase.
                enum:
                - Pending
                - Provisioning
                - Running
                - Succeeded
                - Failed
                - Cancelling
                - Cancelled
                type: string
              podName:
