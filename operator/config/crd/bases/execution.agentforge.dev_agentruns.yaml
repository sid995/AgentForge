                type: boolean
              desiredState:
                default: Running
                description: desiredState is the only ordinary mutable desired-state
                  field.
                enum:
                - Running
                - Cancelled
                type: string
                x-kubernetes-validations:
                - message: desiredState cannot return to Running after cancellation
                  rule: 'oldSelf == ''Cancelled'' ? self == ''Cancelled'' : true'
              executionProfile:
                description: executionProfile selects an approved cluster-side workload
                  profile.
                maxLength: 63
                pattern: ^[a-z0-9][a-z0-9._-]{0,62}$
                type: string
              network:
                description: NetworkSpec defines the workload network policy profile.
                properties:
                  allowedDestinationsRef:
                    description: allowedDestinationsRef names an approved destination
                      policy in this namespace.
                    properties:
                      name:
                        description: name is a DNS subdomain name of the referenced
                          object.
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  profile:
                    default: Isolated
                    description: profile selects an approved deny-by-default network
                      posture.
                    enum:
                    - Isolated
                    - RestrictedEgress
                    type: string
                type: object
                x-kubernetes-validations:
                - message: allowedDestinationsRef is required only for RestrictedEgress
                  rule: 'self.profile == ''RestrictedEgress'' ? has(self.allowedDestinationsRef)
