---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - execution.agentforge.dev
  resources:
  - agentruns
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - execution.agentforge.dev
  resources:
  - agentruns/finalizers
  verbs:
  - patch
  - update
- apiGroups:
  - execution.agentforge.dev
  resources:
  - agentruns/status
  verbs:
  - get
  - patch
  - update
